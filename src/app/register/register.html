<div fxLayout="row" fxLayoutAlign="center">
    <div fxLayout="column" fxFlex="1000px">
        <form class="mt-60" #customersFrm="ngForm" (ngSubmit)="save()">
            <mat-card>
                <mat-card-header>
                    <mat-card-title>
                        Dados Pessoais
                    </mat-card-title>
                </mat-card-header>
                <mat-card-content class="mt-20">
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="800px">
                            <mat-form-field class="full-width">
                                <mat-label>Nome: *</mat-label>
                                <input  type="text"
                                        placeholder="Ex: José da Silva"
                                        [(ngModel)]="customer.name"
                                        name="name"
                                        matInput>
                            </mat-form-field>
                        </div>
                    </div>

                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="800px">
                            <mat-form-field class="full-width">
                                <mat-label>E-mail: *</mat-label>
                                <input  type="email"
                                        placeholder="Digite seu e-mail"
                                        [(ngModel)]="customer.email"
                                        name="email"
                                        matInput>
                            </mat-form-field>
                        </div>
                    </div>

                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="400px">
                            <mat-form-field class="full-width">
                                <mat-label>CPF: *</mat-label>
                                <input  type="email"
                                        placeholder="Digite seu CPF"
                                        [(ngModel)]="customer.document"
                                        name="cpf"
                                        matInput>
                            </mat-form-field>
                        </div>
                    </div>

                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column" fxFlex="400px">
                            <mat-form-field class="full-width">
                                <mat-label>Data Nascimento: *</mat-label>
                                <input  type="email"
                                        placeholder="dd/MM/yyyy"
                                        [(ngModel)]="customer.birthday"
                                        name="dataNascimento"
                                        matInput>
                            </mat-form-field>
                        </div>
                    </div>
                </mat-card-content>

                <mat-card-actions>
                    <button mat-flat-button type="submit" (click)="save()">
                        <mat-icon fontIcon="save"></mat-icon>
                        Salvar
                    </button>
                    <button mat-flat-button class="ml-5 clear-button" type="button" (click)="clear()">
                        <mat-icon fontIcon="delete"></mat-icon>
                        Limpar
                    </button>
                </mat-card-actions>
            </mat-card>
        </form>
    </div>
</div>
