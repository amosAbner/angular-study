<div class="container">

    <h1>Lista de Compras</h1>

    <form #frm="ngForm" class="add-item-form" (ngSubmit)="addItem()">
        <input  type="text"
                id="item"
                name="item"
                [(ngModel)]="item"
                placeholder="Digite o item..."/>
        <button class="add-button" type="button" id="add-item" (click)="addItem()">Adicionar</button>

        <button class="remove-button" type="button" (click)="removeItens()">Limpar lista</button>
    </form>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Item</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="shopping-list">
                @for(element of listItem; track element.id) {
                    <tr>
                        <td>{{ element.id }}</td>
                        <td>
                            <span [ngClass]="{ 'item-checked' : element.isBought }">
                                {{ element.itemName }}
                            </span>
                        </td>
                        <td>
                            <input  type="checkbox" 
                                    (click)="itemChecked(element)"
                                    [checked]="element.isBought"/>
                        </td>
                    </tr>
                } @empty {
                    <tr>
                        <td></td>
                        <td>Adicione os items desejados</td>
                        <td></td>
                    </tr>
                }
            </tbody>
        </table>
</div>
